name: build
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: test -f dist/index.html && test -f dist/badge/aop.json && node -e "JSON.parse(require('fs').readFileSync('dist/index.json','utf8'))"
