name: The Twelve-Factor App
kind: principles
line: Twelve factors for building software-as-a-service applications that are portable, declarative and ready to scale, written at Heroku from experience operating hundreds of thousands of apps.
canonical: https://12factor.net/
repo: https://github.com/heroku/12factor
status_of_text: stable
maintainer: Adam Wiggins, Heroku
first_published: "2011"
listing: listed
order: 110
tenets_label: The twelve factors
tenets:
  - Codebase. One codebase tracked in revision control, many deploys.
  - Dependencies. Explicitly declare and isolate dependencies.
  - Config. Store config in the environment.
  - Backing services. Treat backing services as attached resources.
  - Build, release, run. Strictly separate build and run stages.
  - Processes. Execute the app as one or more stateless processes.
  - Port binding. Export services via port binding.
  - Concurrency. Scale out via the process model.
  - Disposability. Maximize robustness with fast startup and graceful shutdown.
  - Dev/prod parity. Keep development, staging and production as similar as possible.
  - Logs. Treat logs as event streams.
  - Admin processes. Run admin and management tasks as one-off processes.
related: [12fc, 12-factor-agents]
