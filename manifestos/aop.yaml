tenets_label: The six laws
tenets:
  - Read before write. A mutation of an entity the actor has not read in the current operation context is rejected.
  - Validate schema before mutation. Writes that do not match the declared schema are rejected.
  - Preserve graph integrity. No dangling relations, no missing targets, no forbidden cycles; deletes follow the declared rule.
  - Emit an event for every mutation, before success is returned. No silent writes.
  - Check capabilities at action time. A revoked grant takes effect on the next request.
  - Respect lifecycle gates. No undeclared transitions; each declared one needs its capability.
  - Rejections are typed and structured, four fields, never silent; governance rejections are audited.
