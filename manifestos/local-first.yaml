name: Local-first software
kind: principles
line: Seven ideals for software that keeps the primary copy of data on the user's device while still supporting collaboration, from the Ink and Switch essay that named the category.
canonical: https://www.inkandswitch.com/local-first/
status_of_text: stable
maintainer: Martin Kleppmann, Adam Wiggins, Peter van Hardenberg, Mark McGranaghan (Ink and Switch)
first_published: "2019-04"
listing: listed
order: 140
tenets_label: The seven ideals
tenets:
  - No spinners. Your work at your fingertips.
  - Your work is not trapped on one device.
  - The network is optional.
  - Seamless collaboration with your colleagues.
  - The Long Now. Your data for the long term.
  - Security and privacy by default.
  - You retain ultimate ownership and control.
