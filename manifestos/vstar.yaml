tenets_label: What it fixes
tenets:
  - Time, identity and sequence semantics already exist in RFC 5545 and RFC 6350; agent state maps onto them instead of inventing a protocol.
  - Each state component has one canonical mapping and a canonicalization rule, so two implementations produce the same bytes.
  - Versions are independent directories; breaking changes open a new one.
