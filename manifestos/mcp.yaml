name: Model Context Protocol
short: MCP
kind: specification
line: An open protocol, built on JSON-RPC, for connecting LLM applications to external data sources and tools through hosts, clients and servers.
canonical: https://modelcontextprotocol.io/specification/2026-07-28
repo: https://github.com/modelcontextprotocol/modelcontextprotocol
version: "2026-07-28"
status_of_text: stable
license: Apache 2.0
publisher: foundation
maintainer: MCP Steering Group, Model Context Protocol a Series of LF Projects, LLC
first_published: "2024-11-05"
listing: listed
tenets_label: Key principles
tenets:
  - Users must explicitly consent to and understand all data access and operations.
  - Users must retain control over what data is shared and what actions are taken.
  - Implementors should provide clear UIs for reviewing and authorizing activities.
  - Hosts must obtain explicit user consent before exposing user data to servers.
  - Hosts must not transmit resource data elsewhere without user consent.
  - User data should be protected with appropriate access controls.
  - Tools represent arbitrary code execution and must be treated with appropriate caution.
  - Hosts must obtain explicit user consent before invoking any tool.
  - Users should understand what each tool does before authorizing its use.
  - "Base protocol: JSON-RPC message format, stateless self-contained requests, per-request capability negotiation."
  - "Servers offer Resources, Prompts and Tools; clients may offer Elicitation."
  - Extensions are always opt-in and require explicit support from both client and server.
related: [12fc, pact, a2a, openappa]
