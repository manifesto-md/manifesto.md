tenets_label: Behavioural invariants
tenets:
  - Native authority is preserved. Admission and reputation cannot override native authentication or authorization.
  - Required fields have required provenance. Security-relevant claims need a trusted source with authority over them.
  - The presenter is bound to the subject. No reuse of another agent's identity or evidence without a recognized delegation.
  - A result is request-specific. Profile, intent, principal, gateway, requirement version and operation are bound together.
  - No positive result from uncertainty. Missing evidence, stale state or an unavailable dependency never yields admissible.
  - Learning stays within policy. Autonomous changes cannot remove immutable requirements or expand native authority.
  - Reputation follows evidence; incidents survive decay.
  - Every completed authenticated evaluation has a receipt.
