family: ideacrafters
order: 10
tenets_label: The twelve factors
tenets:
  - Capability introspection. The CLI exposes its capabilities in a machine-readable format.
  - Intent clarity. Commands express intent, not syntax.
  - Structured I/O. Machine-readable output with a stable schema, strict channel discipline.
  - Corrective error model. Errors carry a stable code, the failing input, a transience class and a suggested fix.
  - Explicit contracts. Idempotency, side effects, retry semantics, schema versioning and partial failure are declared.
  - Previewability. Every mutating operation can be previewed; nothing blocks on a prompt without a TTY.
  - Idempotency by default, or declared otherwise with a safe retry strategy.
  - State transparency. All implicit state is inspectable.
  - Contextual guidance. Help that answers the situation, not the flag list.
  - Delegation safety. Scoped permissions, confirmation policies, sandboxing, rate limits, policy enforcement.
  - Exit code semantics. Zero means success, never a swallowed error; failure classes are distinguishable.
  - Evolution guarantees. Changes announce themselves; renaming an error code is a breaking change.
